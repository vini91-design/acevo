<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Primeiro Site</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }
        header {
            background-color: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }
        main {
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
        }
        h1 {
            color: #333;
        }
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <header>
        <h1>Bem-vindo ao meu site!</h1>
    </header>
    
    <main>
        <h2>Sobre mim</h2>
        <p>Este é meu primeiro site criado do zero! Estou aprendendo a programar.</p>
        
        <h2>Meus hobbies</h2>
        <ul>
            <li>Aprender programação</li>
            <li>Criar sites</li>
            <li>Explorar tecnologia</li>
        </ul>
        
        <p>Data de criação: <script>document.write(new Date().toLocaleDateString('pt-BR'))</script></p>
    </main>
    
    <footer>
        <p>© 2024 - Meu Primeiro Site</p>
    </footer>
</body>
</html>
